syntax = "proto3";
package farm;

service Manager{
    // One call: upload in, finished result out (manager waits for the worker).
    rpc UploadVideo(UploadRequest) returns (UploadReply);

    // Worker hands over the finished result
    rpc ReportResult(ResultReport) returns (ReportAck);

    // M3: workers ping the manager every few seconds so it can mark them ALIVE/DEAD.
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatAck);

    // M2/M4: dashboard + client can see the worker registry and its state.
    rpc ListWorkers(Empty) returns (WorkerList);
}

// Manager sends the job and then worker ACKs. works in background
service Worker{
    rpc SubmitJob(Job) returns (JobAck);
}

message Empty {}

message UploadRequest {
    string filename = 1; // ex:"myVideo.mp4"
    bytes data = 2;
    string task_type = 3; // "transcode"|"thumbnail"|"subtitles"|"moderation"; empty = manager picks
}

message UploadReply{
    string job_id = 1;
    bytes data = 2;
    string detail = 3; // human-readable summary of what worker did
    string task_type = 4;
    int64 lamport = 5; // manager's Lamport clock when the result was accepted
    
}

message Job {
    string job_id = 1;
    string filename = 2;
    bytes data =3;
    string task_type = 4;
    int64 lamport = 5; // manager stamps at dispatch; worker merges it into its own clock
    int64 attempt = 6; // 1 = first try; increments when a lease expires and job is requeued
}

message JobAck {
    string job_id = 1;
    bool accepted = 2; // the worker's feedback
    string worker_id = 3;
    int64 lamport = 4; // worker's clock after merging the manager's stamp
}

message ResultReport{
    string job_id = 1;
    bytes data = 2;
    string detail = 3;
    string worker_id = 4;
    int64 lamport = 5; // worker's clock at completion
}

message ReportAck {
    bool ok = 1;
}

message HeartbeatRequest {
    string worker_id = 1;
    int64 lamport = 2;
}

message HeartbeatAck {
    bool ok = 1;
    int64 lamport = 2; // manager's clock back to the worker (keeps clocks merged)
}

message WorkerInfo {
    string worker_id = 1;
    string address = 2;
    string state = 3; // "ALIVE" | "SUSPECT" | "DEAD"
    int64 last_seen_epoch = 4; // unix seconds of the last heartbeat
}

message WorkerList {
    repeated WorkerInfo workers = 1;
}

service Raft{
    rpc RequestVote(VoteRequest) returns (VoteReply);

    // leader -> followers: replicate log entries AND serve as heartbeat.
    // An empty `entries` list = pure heartbeat, no new data.
    rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesReply);
}

message VoteRequest {
    int32 term = 1;             // candidate's current term
    string candidate_id = 2;    // e.g. "manager-2"
    int32 last_log_index = 3;   // followers reject candidates with stale logs
    int32 last_log_term = 4;    // term of that last entry
}

message VoteReply {
    int32 term = 1;             // follower's term (candidate steps down if bigger)
    bool vote_granted = 2;
}

message LogEntry {
    int32 term = 1;     // term in which the leader created this entry
    int32 index = 2;    // 1-based position in the replicated log
    bytes command = 3;  // serialized state-machine op, e.g.
                        // {"op":"ENQUEUE_JOB","job_id":"J-...","task_type":"transcode"}
                        // {"op":"JOB_DONE","job_id":"J-..."}
}

message AppendEntriesRequest {
    int32 term = 1;                 // leader's term
    string leader_id = 2;
    int32 prev_log_index = 3;       // entry immediately before the new ones
    int32 prev_log_term = 4;        // its term — the consistency check
    repeated LogEntry entries = 5;  // new entries ([] = heartbeat only)
    int32 leader_commit = 6;        // leader's commitIndex
}

message AppendEntriesReply {
    int32 term = 1;     // follower's current term
    bool success = 2;   // true if log matched prev_log_index/prev_log_term
}
