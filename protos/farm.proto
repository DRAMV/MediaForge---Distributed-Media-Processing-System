syntax = "proto3";
package farm;

service Manager{
    // One call: upload in, finished result out (manager waits for the worker).
    rpc UploadVideo(UploadRequest) returns (UploadReply);

    // Worker hands over the finished result
    rpc ReportResult(ResultReport) returns (ReportAck);

    // M3: workers ping the manager every few seconds so it can mark them ALIVE/DEAD.
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatAck);

    // M2/M4: dashboard + client can see the worker registry and its state.
    rpc ListWorkers(Empty) returns (WorkerList);
}

// Manager sends the job and then worker ACKs. works in background
service Worker{
    rpc SubmitJob(Job) returns (JobAck);
}

message Empty {}

message UploadRequest {
    string filename = 1; // ex:"myVideo.mp4"
    bytes data = 2;
    string task_type = 3; // "transcode"|"thumbnail"|"subtitles"|"moderation"; empty = manager picks
}

message UploadReply{
    string job_id = 1;
    bytes data = 2;
    string detail = 3; // human-readable summary of what worker did
    string task_type = 4;
    int64 lamport = 5; // manager's Lamport clock when the result was accepted
    
}

message Job {
    string job_id = 1;
    string filename = 2;
    bytes data =3;
    string task_type = 4;
    int64 lamport = 5; // manager stamps at dispatch; worker merges it into its own clock
    int64 attempt = 6; // 1 = first try; increments when a lease expires and job is requeued
}

message JobAck {
    string job_id = 1;
    bool accepted = 2; // the worker's feedback
    string worker_id = 3;
    int64 lamport = 4; // worker's clock after merging the manager's stamp
}

message ResultReport{
    string job_id = 1;
    bytes data = 2;
    string detail = 3;
    string worker_id = 4;
    int64 lamport = 5; // worker's clock at completion
}

message ReportAck {
    bool ok = 1;
}

message HeartbeatRequest {
    string worker_id = 1;
    int64 lamport = 2;
}

message HeartbeatAck {
    bool ok = 1;
    int64 lamport = 2; // manager's clock back to the worker (keeps clocks merged)
}

message WorkerInfo {
    string worker_id = 1;
    string address = 2;
    string state = 3; // "ALIVE" | "SUSPECT" | "DEAD"
    int64 last_seen_epoch = 4; // unix seconds of the last heartbeat
}

message WorkerList {
    repeated WorkerInfo workers = 1;
}

